# Station-controller MCU verification for the hydrogen fast-fill governor
# NOSTD twin, per the proven LUXERON/NO_STD-QEMU-TEST-HARNESS cortex-m55
# pattern. Executor-only: no kernel, no float math — the dispenser consumes
# a solved map.

[package]
name = "h2-fill-gov-m55-harness"
version = "0.1.0"
edition = "2021"
license = "PROPRIETARY"

[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["set-sp", "set-vtor"] }
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }
h2-fill-gov-nostd = { path = ".." }

[[bin]]
name = "h2-fill-gov-m55-harness"
path = "src/main.rs"

[[bin]]
name = "mailbox"
path = "src/bin/mailbox.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
